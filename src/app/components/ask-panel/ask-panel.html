<div class="panel">
  <p class="title">{{ t('Outsource decision') }}</p>
  <p class="muted">
    {{
      t(
        'Send the sessions to someone outside the group, so they choose which one gets booked. Which sessions should they see?'
      )
    }}
  </p>
  <div class="chips" role="group" [attr.aria-label]="t('Sessions to include')">
    @for (s of sessions(); track $index) {
      <button
        type="button"
        class="chip"
        [class.on]="picked().has($index)"
        [attr.aria-pressed]="picked().has($index)"
        (click)="toggle($index)"
      >
        <mat-icon>{{ picked().has($index) ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
        {{ label(s) }}
      </button>
    }
  </div>

  <label class="switch">
    <mat-slide-toggle
      [checked]="mode() === 'many'"
      (change)="mode.set($event.checked ? 'many' : 'one')"
    />
    <span class="text">
      <span>{{ t('Multiple choice allowed') }}</span>
      <span class="muted small">{{ t('Off: they pick exactly one session.') }}</span>
    </span>
  </label>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <div class="actions">
    <button type="button" class="pill" (click)="closed.emit()">{{ t('Cancel') }}</button>
    <button mat-flat-button type="button" (click)="create()" [disabled]="!picked().size || busy()">
      <mat-icon>link</mat-icon>
      {{ busy() ? t('Creating…') : t('Create link') }}
    </button>
  </div>
</div>
