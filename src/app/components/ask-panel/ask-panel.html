<div class="panel">
  @if (link(); as url) {
    <div class="ready">
      <span class="title">{{ t('Link ready') }}</span>
      <button mat-flat-button type="button" class="copy" (click)="copy()">
        <mat-icon>{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
        {{ copied() ? t('Copied') : t('Copy link') }}
      </button>
      <button type="button" class="pill close" (click)="closed.emit()">{{ t('Close') }}</button>
    </div>
  } @else {
    <p class="title">{{ t('Send options') }}</p>
    <p class="muted">{{ t('They get a link with only these sessions. Which ones?') }}</p>
    <div class="chips" role="group" [attr.aria-label]="t('Sessions to include')">
      @for (s of sessions(); track $index) {
        <button
          type="button"
          class="chip"
          [class.on]="picked().has($index)"
          [attr.aria-pressed]="picked().has($index)"
          (click)="toggle($index)"
        >
          <mat-icon>{{
            picked().has($index) ? 'check_circle' : 'radio_button_unchecked'
          }}</mat-icon>
          {{ label(s) }}
        </button>
      }
    </div>

    <p class="muted">{{ t('They can pick') }}</p>
    <div class="segments" role="radiogroup" [attr.aria-label]="t('Answer mode')">
      <button
        type="button"
        class="pill"
        role="radio"
        [class.active]="mode() === 'one'"
        [attr.aria-checked]="mode() === 'one'"
        (click)="mode.set('one')"
      >
        {{ t('Just one') }}
      </button>
      <button
        type="button"
        class="pill"
        role="radio"
        [class.active]="mode() === 'many'"
        [attr.aria-checked]="mode() === 'many'"
        (click)="mode.set('many')"
      >
        {{ t('One or more') }}
      </button>
    </div>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <div class="actions">
      <button type="button" class="pill" (click)="closed.emit()">{{ t('Cancel') }}</button>
      <button
        mat-flat-button
        type="button"
        (click)="create()"
        [disabled]="!picked().size || busy()"
      >
        {{ busy() ? t('Creating…') : t('Create link') }}
      </button>
    </div>
  }
</div>
